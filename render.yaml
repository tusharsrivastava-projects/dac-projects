# Render blueprint for the DAC HRM Platform.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard → New → Blueprint → pick this repository.
#   3. Render reads this file, asks for the two values marked sync:false,
#      and deploys. You get an https://<name>.onrender.com URL.
#
# ─────────────────────────────────────────────────────────────────────────────
# STORAGE — read this before a real hiring round.
#
# STORAGE — this is set up to survive restarts.
#
# Recordings go to your Google Drive (STORAGE_DRIVER below), so interview audio
# is safe regardless of plan or disk. Fill in the GOOGLE_* values from
# `npm run google-auth`.
#
# The database sits on a persistent disk, so applications, scores and offers
# survive deploys and restarts. Disks require a paid instance, which is why the
# plan is `starter` (~$7/mo, plus $0.25/GB for the disk).
#
# WANT IT FREE INSTEAD? Change `plan: starter` to `plan: free`, delete the
# `disk:` block, and remove the DATA_DIR variable. Everything still runs and
# recordings still go to Drive — but the database resets on every restart, so
# applications and scores are lost. The app re-seeds the admin account and the
# sample roles on boot, so the link keeps working. Demo only.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: dac-hrm
    runtime: node
    plan: starter
    region: singapore          # closest Render region to Dehradun
    branch: claude/dac-hrm-platform-xploch
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health

    # Keeps the database and any locally-held recordings across restarts.
    disk:
      name: dac-hrm-data
      mountPath: /var/data
      sizeGB: 5

    envVars:
      - key: NODE_ENV
        value: production

      # Render terminates TLS for us, so cookies can be secure-only.
      - key: COOKIE_SECURE
        value: 'true'

      # Points at the mounted disk above. Drop this if you move to the free
      # plan, so the app falls back to its in-repo ./data directory.
      - key: DATA_DIR
        value: /var/data

      # BASE_URL is intentionally unset — the app falls back to
      # RENDER_EXTERNAL_URL, so offer links point at the right host
      # automatically, including on preview environments.

      # Render generates this on first deploy and shows it in the dashboard
      # under Environment. That is your admin password — copy it, sign in,
      # and change it under Profile.
      - key: ADMIN_PASSWORD
        generateValue: true

      - key: ADMIN_EMAIL
        sync: false            # Render prompts you for this
      - key: ADMIN_NAME
        value: DAC Administrator

      # A fresh deploy starts with an admin account and an empty board, so
      # candidates are never shown openings nobody posted. Set this to 'true'
      # only if you want the three sample roles to click around.
      - key: SEED_DEMO_DATA
        value: 'false'

      # ── Where recordings are stored ────────────────────────────────────────
      # 'drive' is what makes the free plan workable: recordings go to your
      # Google Drive instead of a disk that gets wiped on every restart.
      # Run `npm run google-auth` locally to mint the token, then paste the
      # three GOOGLE_* values in here as secrets.
      - key: STORAGE_DRIVER
        value: drive
      - key: GDRIVE_FOLDER_NAME
        value: DAC Interview Submissions
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_SCOPE
        value: https://www.googleapis.com/auth/drive.file

      # Sign in with Google for candidates. Uses the same OAuth client as
      # Drive above — just add https://<your-host>/api/auth/google/callback to
      # its authorised redirect URIs. The button hides itself when unset.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_STATE_SECRET
        generateValue: true

      - key: MAX_AUDIO_MB
        value: '25'
      - key: SESSION_DAYS
        value: '7'

      # ── Mail ───────────────────────────────────────────────────────────────
      # Without SMTP_HOST every letter is held in the in-app Mail outbox and
      # nothing is delivered. Fill these in from the Render dashboard when you
      # are ready to send for real; SMTP_PASS should be a secret, not committed.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: DAC Talent <no-reply@dgu.ac.in>

      # ── Branding on offer letters ──────────────────────────────────────────
      - key: ORG_NAME
        value: DAC — DGU AI Cell
      - key: ORG_PARENT
        value: DBS Global University
      - key: ORG_ADDRESS
        value: Dehradun, Uttarakhand, India
      - key: ORG_SIGNATORY
        value: Head of Talent
      - key: ORG_SIGNATORY_NAME
        value: DAC Hiring Office
      - key: ORG_WEBSITE
        value: https://dgu.ac.in

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="DAC - DGU AI Cell">
  <title>DAC — DGU AI Cell</title>
  <defs>
    <linearGradient id="dacSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#eceef4"/>
      <stop offset="54%" stop-color="#979cae"/>
      <stop offset="76%" stop-color="#f3f4f8"/>
      <stop offset="100%" stop-color="#b4b8c8"/>
    </linearGradient>
    <linearGradient id="dacViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b877f7"/>
      <stop offset="52%" stop-color="#8438d4"/>
      <stop offset="100%" stop-color="#5f229b"/>
    </linearGradient>
    <linearGradient id="dacArrow" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#9c1424"/>
      <stop offset="40%" stop-color="#e0202f"/>
      <stop offset="100%" stop-color="#ff5361"/>
    </linearGradient>
    <radialGradient id="dacVignette" cx="50%" cy="40%" r="64%">
      <stop offset="0%" stop-color="#190a2a"/>
      <stop offset="60%" stop-color="#090410"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <g id="dacTrace">
      <path d="M0 0 H30 l14 -14 H74" fill="none" stroke="#a259e6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="74" cy="-14" r="4.6" fill="#c58bff"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="#000000"/>
  <circle cx="200" cy="200" r="198" fill="url(#dacVignette)"/>

  <!-- circuit field -->
  <g opacity="0.92">
    <g transform="translate(268 150)"><use href="#dacTrace"/></g>
    <g transform="translate(276 182)"><use href="#dacTrace"/></g>
    <g transform="translate(272 244) scale(1 -1)"><use href="#dacTrace"/></g>
    <g transform="translate(262 274) scale(1 -1)"><use href="#dacTrace"/></g>
    <g transform="translate(132 154) rotate(180)"><use href="#dacTrace"/></g>
    <g transform="translate(124 246) rotate(180) scale(1 -1)"><use href="#dacTrace"/></g>
    <g transform="translate(118 282) rotate(180) scale(1 -1)"><use href="#dacTrace"/></g>
    <path d="M256 122 h24 l16 16 v22" fill="none" stroke="#8e45d6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M144 288 h-22 l-16 -16 v-22" fill="none" stroke="#8e45d6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="296" cy="160" r="4.4" fill="#c58bff"/>
    <circle cx="106" cy="250" r="4.4" fill="#c58bff"/>
    <circle cx="90" cy="196" r="3.6" fill="#9b55e8"/>
    <circle cx="310" cy="208" r="3.6" fill="#9b55e8"/>
  </g>

  <!-- badge rings -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="#7b34c4" stroke-width="4"/>
  <circle cx="200" cy="200" r="181" fill="none" stroke="#54208a" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="200" r="166" fill="none" stroke="url(#dacViolet)" stroke-width="8.5"/>

  <!-- rising arrow, above the wordmark -->
  <g>
    <path d="M104 156 L132 108 L152 124 L178 72" fill="none" stroke="url(#dacArrow)" stroke-width="12.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M147 66 L189 56 L182 98 Z" fill="url(#dacArrow)"/>
  </g>

  <!-- wordmark: D A C -->
  <g stroke="#40146c" stroke-width="4.5" stroke-linejoin="round">
    <path fill="url(#dacSteel)" fill-rule="evenodd"
          d="M96 168 H140 l22 22 v62 l-22 22 H96 Z M117 190 v54 h17 l7 -7 v-40 l-7 -7 Z"/>
    <path fill="url(#dacSteel)" fill-rule="evenodd"
          d="M186 168 h30 l35 106 h-27 l-7 -23 h-33 l-7 23 h-27 Z M201 200 l-9 28 h18 Z"/>
    <path fill="url(#dacSteel)"
          d="M304 168 h-46 l-22 22 v62 l22 22 h46 v-25 h-35 l-7 -7 v-40 l7 -7 h35 Z"/>
  </g>

  <!-- AI chip over the A -->
  <g>
    <g stroke="#c58bff" stroke-width="3" stroke-linecap="round">
      <path d="M189 190 v-8 M201 190 v-8 M213 190 v-8 M189 240 v8 M201 240 v8 M213 240 v8"/>
      <path d="M184 201 h-8 M184 214 h-8 M184 228 h-8 M218 201 h8 M218 214 h8 M218 228 h8"/>
    </g>
    <rect x="181" y="188" width="40" height="54" rx="7" fill="#1b0a2e" stroke="#a259e6" stroke-width="3.6"/>
    <text x="201" y="224" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
          font-size="25" font-weight="700" fill="#ffffff" letter-spacing="0.5">AI</text>
  </g>

  <!-- lockup -->
  <text x="200" y="326" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
        font-size="23" font-weight="600" fill="#f3f0fa" letter-spacing="3">( DGU AI CELL )</text>
</svg>
